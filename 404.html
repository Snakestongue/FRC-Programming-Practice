<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Perscript</title>
  <script>
    const oldName = "/FRC-Programming-Practice";
    const newName = "/Perscript";
    let path = window.location.pathname
    if (path.startsWith(oldName)) {
      path = path.substring(oldName.length);
    }
    const newUrl = newName + path+window.location.search +window.location.hash;
    window.location.replace(newUrl)
  </script>
</head>
<body>
  <p>
    This project has moved.
    <a href="/Perscript/">Continue to Perscript</a>
  </p>
</body>
</html>
